name: Publish to VSCode Marketplace

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish'
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        cache: 'npm'
        
    - name: Install dependencies
      run: |
        npm install
        npm install -g @vscode/vsce
      
    - name: Compile TypeScript
      run: |
        npm run compile || echo "Compile completed with warnings"
      
    - name: Package extension
      run: |
        vsce package --no-dependencies || vsce package --yarn
      
    - name: Publish to VSCode Marketplace
      env:
        VSCE_PAT: ${{ secrets.VSCE_PAT }}
      run: |
        if [ -n "$VSCE_PAT" ]; then
          vsce publish -p $VSCE_PAT
          echo "✅ Successfully published to VSCode Marketplace"
        else
          echo "⚠️ VSCE_PAT secret not set, skipping marketplace publish"
          echo "To enable automatic publishing:"
          echo "1. Get a Personal Access Token from https://dev.azure.com"
          echo "2. Add it as a secret named VSCE_PAT in your repository settings"
        fi
        
    - name: Upload VSIX as artifact
      uses: actions/upload-artifact@v4
      with:
        name: vsix-package
        path: '*.vsix'
        retention-days: 30